borderColor = "#DCE5DF"
dataframeHeaderBackgroundColor = "#EDF2ED"

[theme.dark]
primaryColor = "#6BD9AA"
backgroundColor = "#111A16"
secondaryBackgroundColor = "#223229"
textColor = "#E5EEEA"
borderColor = "#33443C"
dataframeHeaderBackgroundColor = "#223229"
