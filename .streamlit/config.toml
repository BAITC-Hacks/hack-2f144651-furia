[server]
address = "127.0.0.1"
port = 8501
headless = true
maxUploadSize = 80

[browser]
gatherUsageStats = false

[theme]
base = "light"
font = "sans serif"
primaryColor = "#087F5B"

[theme.light]
primaryColor = "#087F5B"
