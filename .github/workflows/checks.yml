name: EKT checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install locked dependencies
        run: ${{ matrix.python }} -m pip install -r requirements.lock
      - name: Check dependencies
        run: ${{ matrix.python }} -m pip check
      - name: Tests including frontend workflow
        run: ${{ matrix.python }} -m pytest -q
      - name: Import, calculate, review and export synthetic data
        run: ${{ matrix.python }} scripts/smoke.py
      - name: Reproducible synthetic forecast evaluation
        run: ${{ matrix.python }} -m scripts.evaluate_forecast --demo --output work/evaluation.json
